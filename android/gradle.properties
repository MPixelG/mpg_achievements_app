org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 opt-outs, matching the Flutter 3.47 template: keep the legacy variant API
# (the Flutter Gradle plugin and older plugins like thermion_flutter still use it)
# and let the Flutter plugin apply Kotlin instead of AGP's built-in Kotlin support.
android.newDsl=false
android.builtInKotlin=false
